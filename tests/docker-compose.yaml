version: "3"
services:
  # Test-only deterministic replacement for the Assisted Profile agent.
  fake-agent:
    build:
      context: .
      dockerfile: e2e/fake-agent/Dockerfile
    environment:
      DEFAULT_BEHAVIOR: "healthy"
      SLOW_DELAY_MS: "5000"
    expose:
      - "8080"
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080/health']
      interval: 2s
      timeout: 1s
      retries: 10

  mysql:
    image: "mysql:latest"
    container_name: "fwcloud-mysql"
    ports:
      - "8887:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: "fwcdbusr"
      MYSQL_PASSWORD: "fwcdbusr"
      MYSQL_DATABASE: "fwcloud"
      
  mysql-test:
    image: "mysql:latest"
    container_name: "fwcloud-testing-mysql"
    ports:
      - "8888:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: "fwcdbusr"
      MYSQL_PASSWORD: "fwcdbusr"
      MYSQL_DATABASE: "fwcloud"

  mariadb:
    image: "mariadb:latest"
    container_name: "fwcloud-testing-mariadb"
    ports:
      - "8889:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: "fwcdbusr"
      MYSQL_PASSWORD: "fwcdbusr"
      MYSQL_DATABASE: "fwcloud"
