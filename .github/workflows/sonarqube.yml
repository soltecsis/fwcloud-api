name: FWCloud-API SonarQube

on:
  workflow_run:
    workflows: [FWCloud-API CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube analysis and Quality Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # workflow_run executes the workflow from the default branch. Utilities and
      # scanner settings come from that trusted revision, never from the PR.
      - name: Checkout trusted analysis configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      # Temporarily read project identifiers from the trusted sonar-project.properties.
      # Restore this validation together with the scanner overrides when using Actions variables.
      # - name: Validate project identifiers
      #   env:
      #     SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      #     SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      #   run: |
      #     node -e '
      #       if (!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,99}$/.test(process.env.SONAR_ORGANIZATION) ||
      #           !/^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,399}$/.test(process.env.SONAR_PROJECT_KEY)) {
      #         console.error("Configure SONAR_ORGANIZATION and SONAR_PROJECT_KEY Actions variables.");
      #         process.exit(1);
      #       }
      #     '
      - name: Resolve tested revision and coverage from GitHub
        id: analysis
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { resolveContext } = require('./ci/scripts/sonar-analysis.cjs');
            await resolveContext({ github, context, core });
      - name: Checkout tested source as data
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.analysis.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Download reference coverage from the producing CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.analysis.outputs.artifact_id }}
          merge-multiple: true
          path: coverage-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify coverage and install trusted scanner settings
        run: |
          node -e '
            const fs = require("node:fs");
            const { prepare } = require("./ci/scripts/sonar-analysis.cjs");
            const run = JSON.parse(fs.readFileSync("reports/sonar/context.json", "utf8"));
            const metadata = prepare("source", "coverage-input", "ci", run);
            fs.writeFileSync("reports/sonar/context.json", JSON.stringify(metadata, null, 2));
          '
      - name: Official SonarQube scan and Quality Gate
        id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: source
          scannerVersion: 8.1.0.6389
          skipSignatureVerification: false
          # Temporary file-based identifiers; overrides disabled outside the args value:
          # -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          # -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          args: ${{ steps.analysis.outputs.args }}
      - name: Record aggregate analysis evidence
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { recordEvidence } = require("./ci/scripts/sonar-analysis.cjs");
            recordEvidence(JSON.parse(fs.readFileSync("reports/sonar/context.json", "utf8")), process.env.SCAN_OUTCOME);
          '
      - name: Upload aggregate SonarQube evidence
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sonarqube-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/sonar/metadata.json
          retention-days: 90
          if-no-files-found: error
