name: FWCloud-API CI

on:
  push:
    branches:
      - main
      - fixes
      - ENS
  pull_request:
    branches:
      - devel
      - fixes
      - auditlogs
      - ENS
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  HUSKY: '0'

jobs:
  quality:
    name: FWCloud-API Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
      - name: Run Prettier
        run: npm run format:check
      - name: Verify CI report collector
        run: node --test scripts/ci-reports.test.cjs
      - name: Verify Gitleaks report collector
        run: node --test scripts/gitleaks-report.test.cjs
      - name: Verify Trivy report collector
        run: node --test scripts/trivy-report.test.cjs scripts/trivy-run.test.cjs
      - name: Verify ZAP scope and CI policy
        run: |
          node --test scripts/zap-scope.test.cjs
          python3 .github/zap/auth-hook.test.py

  secrets:
    name: FWCloud-API Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Determine scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git cat-file -e "$HEAD_SHA^{commit}"
          if [ "$EVENT_NAME" = pull_request ]; then
            git cat-file -e "$BASE_SHA^{commit}"
            MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            test -n "$MERGE_BASE"
            LOG_OPTS="$MERGE_BASE..$HEAD_SHA"
            SCAN_SCOPE="pull-request:$LOG_OPTS"
          elif [ "$EVENT_NAME" = push ]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              LOG_OPTS="$HEAD_SHA"
              SCAN_SCOPE="new-branch-history:$HEAD_SHA"
            else
              git cat-file -e "$BEFORE_SHA^{commit}"
              LOG_OPTS="$BEFORE_SHA..$HEAD_SHA"
              SCAN_SCOPE="push:$LOG_OPTS"
            fi
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            LOG_OPTS="--all"
            SCAN_SCOPE="full-history"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          echo "log_opts=$LOG_OPTS" >> "$GITHUB_OUTPUT"
          echo "scan_scope=$SCAN_SCOPE" >> "$GITHUB_OUTPUT"
      - name: Scan secrets
        id: gitleaks
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        run: |
          mkdir -p reports/secrets
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="$GITLEAKS_LOG_OPTS" \
            --redact=100 \
            --report-format json \
            --report-path reports/secrets/gitleaks.json \
            --timeout 300 \
            --no-banner \
            --no-color \
            .
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Verify and summarize secret scan
        id: secret_report
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
          GITLEAKS_LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
          GITLEAKS_SCAN_SCOPE: ${{ steps.scope.outputs.scan_scope }}
        run: node scripts/gitleaks-report.cjs
      - name: Remove detailed secret report
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        run: rm -f reports/secrets/gitleaks.json
      - name: Upload redacted secret scan evidence
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/secrets/metadata.json
          retention-days: 90
          if-no-files-found: error

  sca:
    name: FWCloud-API SCA and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Load shared Trivy configuration
        run: |
          node -e '
            const fs = require("node:fs");
            const c = require("./scripts/trivy-config.json");
            fs.appendFileSync(process.env.GITHUB_ENV, [
              "TRIVY_VERSION=" + c.version,
              "TRIVY_ARCHIVE=" + c.archive,
              "TRIVY_ARCHIVE_SHA256=" + c.archiveSha256,
              "TRIVY_BINARY=" + process.env.RUNNER_TEMP + "/trivy",
              ""
            ].join("\n"));
          '
      - name: Install Trivy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" \
            --output "$RUNNER_TEMP/$TRIVY_ARCHIVE"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$RUNNER_TEMP/$TRIVY_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TRIVY_ARCHIVE" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version
      - name: Scan dependency vulnerabilities
        id: trivy
        run: |
          set +e
          node scripts/trivy-run.cjs json
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          set +e
          node scripts/trivy-run.cjs sbom
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Record Trivy and database versions
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        run: node scripts/trivy-run.cjs version
      - name: Verify and summarize dependency scan
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        env:
          TRIVY_EXIT_CODE: ${{ steps.trivy.outputs.exit_code }}
          TRIVY_SBOM_EXIT_CODE: ${{ steps.sbom.outputs.exit_code }}
        run: node scripts/trivy-report.cjs
      - name: Remove detailed vulnerability report
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        run: rm -f reports/dependencies/trivy.json reports/dependencies/trivy-version.json
      - name: Upload dependency security evidence
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sca-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/dependencies/metadata.json
            reports/dependencies/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  dast:
    name: FWCloud-API ZAP and HTTP Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: prod
      TYPEORM_HOST: 127.0.0.1
      TYPEORM_PORT: '13306'
      TYPEORM_DATABASE: fwcloud_zap
      TYPEORM_USERNAME: fwcdbusr
      TYPEORM_PASSWORD: fwcdbusr
      APISRV_IP: 127.0.0.1
      APISRV_PORT: '3131'
      APISRV_HTTPS: 'false'
      SESSION_FORCE_HTTPS: 'false'
      CORS_ENABLED: 'true'
      CORS_WHITELIST: https://zap.invalid
      CONFIRMATION_TOKEN: 'true'
      MAINTENANCE_MODE: 'false'
      SSH_COMMUNICATION_ENABLED: 'false'
      SESSION_KEEPALIVE_MS: '1800000'
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        ports:
          - 13306:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: fwcloud_zap
          MYSQL_USER: fwcdbusr
          MYSQL_PASSWORD: fwcdbusr
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and build API
        run: |
          npm ci --include=dev
          npm run build
      - name: Generate ephemeral runtime secrets
        run: |
          node -e '
            const fs = require("node:fs"), crypto = require("node:crypto");
            fs.appendFileSync(process.env.GITHUB_ENV,
              "SESSION_SECRET=" + crypto.randomBytes(32).toString("hex") + "\n" +
              "CRYPT_SECRET=" + crypto.randomBytes(32).toString("hex") + "\n");
          '
      - name: Start temporary API
        id: api
        run: |
          node .github/zap/start.cjs > "$RUNNER_TEMP/zap-api.log" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
      - name: Verify login is reachable with valid-shaped input
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {customer: 1, username: 'zapuser', password: 'zapinvalid', authCode: null, publicKey: 'lab-client'};
          (async () => {
            for (let attempt = 0; attempt < 90; attempt++) {
              try {
                const response = await fetch('http://127.0.0.1:3131/user/login', {
                  method: 'POST', headers: {'Content-Type': 'application/json', Origin: 'https://zap.invalid'},
                  body: JSON.stringify(payload), signal: AbortSignal.timeout(3000)
                });
                const result = await response.json();
                if (response.status !== 401 || result.fwcErr !== 1001) throw new Error('Login did not reach credential verification.');
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Login DAST preflight: expected 401/BAD_LOGIN confirmed.\n');
                return;
              } catch (error) {
                if (attempt === 89) throw error;
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
            }
          })().catch(() => { console.error('ZAP login preflight failed.'); process.exitCode = 1; });
          NODE
      - name: Official ZAP API Scan (login only)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        env:
          ZAP_AUTH_HEADER: Origin
          ZAP_AUTH_HEADER_VALUE: https://zap.invalid
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        with:
          target: .github/zap/login.openapi.yaml
          format: openapi
          rules_file_name: .github/zap/rules.tsv
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          allow_issue_writing: false
          fail_action: true
          artifact_name: backend-zap-login-${{ github.run_id }}-${{ github.run_attempt }}
          cmd_options: '-s -T 5 -z "-silent -config scanner.threadPerHost=1"'
      - name: Create synthetic accounts after public reports are finished
        run: node .github/zap/fixtures.cjs > "$RUNNER_TEMP/zap-fixture.log" 2>&1
      - name: Verify real HTTP security controls before authenticated scan
        id: http_before
        run: node .github/zap/http-check.cjs before
      - name: Official packaged ZAP API Scan (authenticated queries)
        id: authenticated_zap
        env:
          ZAP_AUTH_HEADER: Cookie
          ZAP_AUTH_HEADER_SITE: 127.0.0.1
        run: |
          chmod a+w reports/dast
          set +e
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            -e CI -e GITHUB_SHA -e GITHUB_RUN_ID \
            -e ZAP_AUTH_HEADER -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t reports/dast/authenticated.openapi.json -f openapi \
            -c .github/zap/rules.tsv --hook /zap/wrk/.github/zap/auth-hook.py \
            -s -T 5 -z "-silent -config scanner.threadPerHost=1" \
            > "$RUNNER_TEMP/zap-auth.log" 2>&1
          STATUS=$?
          set -e
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" -eq 0
      - name: Verify protected content and logout after scan
        if: ${{ always() && steps.authenticated_zap.outcome != 'skipped' }}
        run: node .github/zap/http-check.cjs after
      - name: Publish credential-free HTTP and authenticated ZAP evidence
        if: ${{ always() && steps.http_before.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-zap-authenticated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/dast/http-before.json
            reports/dast/http-after.json
            reports/dast/authenticated.json
            reports/dast/authenticated.openapi.json
          retention-days: 90
          if-no-files-found: error
      - name: Stop temporary API
        if: ${{ always() && steps.api.outputs.pid != '' }}
        env:
          API_PID: ${{ steps.api.outputs.pid }}
        run: |
          if kill -0 "$API_PID" 2>/dev/null; then
            kill "$API_PID"
          fi
      - name: Remove ephemeral credentials and private diagnostics
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/zap-fixture.json" "$RUNNER_TEMP/zap-sessions.json" "$RUNNER_TEMP/zap-auth.log" "$RUNNER_TEMP/zap-api.log" "$RUNNER_TEMP/zap-fixture.log"
          rm -rf "$RUNNER_TEMP/zap-api-sessions" "$RUNNER_TEMP/zap-api-logs"

  test:
    name: FWCloud-API Test (Node ${{ matrix.node-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    # timeout-minutes: 120

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && matrix.image || '' }}
        ports:
          - 8888:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql8:
        image: ${{ matrix.database == 'mysql8' && matrix.image || '' }}
        ports:
          - 8890:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mariadb:
        image: ${{ matrix.database == 'mariadb' && matrix.image || '' }}
        ports:
          - 8889:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        database: [mysql, mysql8, mariadb]
        include:
          - database: mysql
            port: 8888
            image: mysql:5.7
          - database: mysql8
            port: 8890
            image: mysql:8.0
          - database: mariadb
            port: 8889
            image: mariadb:10.1

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Show runtime versions
      run: |
        node --version
        npm --version
    - name: Disable mysqldump column statistics
      run: echo 'column-statistics=0' | sudo tee -a /etc/mysql/conf.d/mysqldump.cnf
    - name: Install dependencies
      run: npm ci
    - name: Verify database connection
      env:
        TYPEORM_PORT: ${{ matrix.port }}
      run: |
        node <<'NODE'
        const mysql = require('mysql2/promise');
        (async () => {
          const connection = await mysql.createConnection({
            host: '127.0.0.1',
            port: Number(process.env.TYPEORM_PORT),
            user: 'fwcdbusr',
            password: 'fwcdbusr',
            database: 'fwcloud',
            connectTimeout: 10000,
          });
          try {
            await connection.query('SELECT 1');
          } finally {
            await connection.end();
          }
        })().catch(error => {
          console.error(error);
          process.exitCode = 1;
        });
        NODE
    - name: Build FWCloud
      run: npm run build
    - name: Run tests
      id: tests
      run: |
        mkdir -p reports/tests
        if [ "$COVERAGE_EXPECTED" = true ]; then
          npm run test:coverage:ci
        else
          npm run test:ci
        fi
      env:
        TYPEORM_PORT: ${{ matrix.port }}
        COVERAGE_EXPECTED: ${{ matrix.node-version == '22' && matrix.database == 'mysql8' }}
    - name: Verify reports and summarize results
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      run: npm run ci:reports
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        TEST_DATABASE: ${{ matrix.database }}
        TEST_DATABASE_IMAGE: ${{ matrix.image }}
        COVERAGE_EXPECTED: ${{ matrix.node-version == '22' && matrix.database == 'mysql8' }}
    - name: Upload test evidence
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-tests-node${{ matrix.node-version }}-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          reports/tests/
          reports/metadata.json
        retention-days: 90
        if-no-files-found: error
    - name: Upload coverage evidence
      if: ${{ always() && steps.tests.outcome != 'skipped' && matrix.node-version == '22' && matrix.database == 'mysql8' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-coverage-node22-mysql8-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/coverage/
        retention-days: 90
        if-no-files-found: error

  backend-ci:
    name: backend-ci
    if: ${{ always() }}
    needs: [quality, test, secrets, sca, dast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$SECRETS_RESULT" = success
          test "$SCA_RESULT" = success
          test "$DAST_RESULT" = success
