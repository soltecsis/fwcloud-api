name: FWCloud-API CI

on:
  push:
    branches:
      - main
      - fixes
      - ENS
  pull_request:
    branches:
      - devel
      - fixes
      - auditlogs
      - ENS
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  HUSKY: '0'

jobs:
  quality:
    name: FWCloud-API Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
      - name: Run Prettier
        run: npm run format:check
      - name: Verify CI report collector
        run: node --test scripts/ci-reports.test.cjs

  test:
    name: FWCloud-API Test (Node ${{ matrix.node-version }}, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      mysql:
        image: mysql:5.7
        ports:
          - 8888:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mysql8:
        image: mysql:8.0
        ports:
          - 8890:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mariadb:
        image: mariadb:10.1
        ports:
          - 8889:3306
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_USER: "fwcdbusr"
          MYSQL_PASSWORD: "fwcdbusr"
          MYSQL_DATABASE: "fwcloud"
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        database: [mysql, mysql8, mariadb]
        include:
          - database: mysql
            port: 8888
            image: mysql:5.7
          - database: mysql8
            port: 8890
            image: mysql:8.0
          - database: mariadb
            port: 8889
            image: mariadb:10.1

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Show runtime versions
      run: |
        node --version
        npm --version
    - name: Disable mysqldump column statistics
      run: echo 'column-statistics=0' | sudo tee -a /etc/mysql/conf.d/mysqldump.cnf
    - name: Install dependencies
      run: npm ci
    - name: Verify database connection
      env:
        TYPEORM_PORT: ${{ matrix.port }}
      run: |
        node <<'NODE'
        const mysql = require('mysql2/promise');
        (async () => {
          const connection = await mysql.createConnection({
            host: '127.0.0.1',
            port: Number(process.env.TYPEORM_PORT),
            user: 'fwcdbusr',
            password: 'fwcdbusr',
            database: 'fwcloud',
            connectTimeout: 10000,
          });
          try {
            await connection.query('SELECT 1');
          } finally {
            await connection.end();
          }
        })().catch(error => {
          console.error(error);
          process.exitCode = 1;
        });
        NODE
    - name: Build FWCloud
      run: npm run build
    - name: Run tests
      id: tests
      run: |
        mkdir -p reports/tests
        if [ "$COVERAGE_EXPECTED" = true ]; then
          npm run test:coverage:ci
        else
          npm run test:ci
        fi
      env:
        TYPEORM_PORT: ${{ matrix.port }}
        COVERAGE_EXPECTED: ${{ matrix.node-version == '22' && matrix.database == 'mysql8' }}
    - name: Verify reports and summarize results
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      run: npm run ci:reports
      env:
        TEST_OUTCOME: ${{ steps.tests.outcome }}
        TEST_DATABASE: ${{ matrix.database }}
        TEST_DATABASE_IMAGE: ${{ matrix.image }}
        COVERAGE_EXPECTED: ${{ matrix.node-version == '22' && matrix.database == 'mysql8' }}
    - name: Upload test evidence
      if: ${{ always() && steps.tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-tests-node${{ matrix.node-version }}-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          reports/tests/
          reports/metadata.json
        retention-days: 90
        if-no-files-found: error
    - name: Upload coverage evidence
      if: ${{ always() && steps.tests.outcome != 'skipped' && matrix.node-version == '22' && matrix.database == 'mysql8' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-coverage-node22-mysql8-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/coverage/
        retention-days: 90
        if-no-files-found: error

  backend-ci:
    name: backend-ci
    if: ${{ always() }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
