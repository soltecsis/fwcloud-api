name: FWCloud-API OpenAPI Docs Deploy Test

on:
  pull_request:
    branches:
      - fixes

jobs:
  ftp-test:
    runs-on: ubuntu-latest

    services:
      ftp:
        image: delfer/alpine-ftp-server 
        ports:
          - 21:21
          - 21000-21010:21000-21010
        env:
          USERS: "testuser|testpass|/home/testuser"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-


      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp ftp

      - name: Wait for FTP to be ready
        run: |
          for i in {1..20}; do
            if nc -z localhost 21; then
              echo "FTP ready"
              exit 0
            fi
            echo "Waiting for FTP..."
            sleep 2
          done

          echo "FTP did not start"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build OpenAPI JSON and static HTML
        run: npm run openapi:redoc:build

      - name: Prepare static bundle
        run: |
          rm -rf src/openapi-docs
          mkdir -p src/openapi-docs
          cp docs/openapi/openapi.html src/openapi-docs/index.html
          cp docs/openapi/openapi.json src/openapi-docs/openapi.json

      - name: Upload files to FTP
        env:
          FTP_HOST: localhost
          FTP_USER: testuser
          FTP_PASSWORD: testpass
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:passive-mode true
          mkdir -f uploads/openapi-docs
          cd uploads/openapi-docs
          put src/openapi-docs/index.html -o index.html
          put src/openapi-docs/openapi.json -o openapi.json
          ls -la
          bye
          EOF

      - name: Verify uploaded files exist
        env:
          FTP_HOST: localhost
          FTP_USER: testuser
          FTP_PASSWORD: testpass
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          cd uploads/openapi-docs
          ls -la
          cat openapi.json
          bye
          EOF
