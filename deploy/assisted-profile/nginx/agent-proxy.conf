# TLS termination for the Assisted Profile pilot agent channel.
#
# Terminates HTTPS from fwcloud-api and forwards plaintext HTTP to
# fwcloud-ai-agent over the private assisted-profile-network only. The
# internal hop is considered trusted because it never leaves that dedicated,
# non-published Docker bridge network (see
# ../../../docs/assisted-profile-pilot-deployment.md, "TLS" section, for the
# full rationale and how to replace it with an internal-TLS topology
# instead).

server {
    listen 8443 ssl;
    server_name fwcloud-ai-agent;

    ssl_certificate     /etc/nginx/certs/agent.crt;
    ssl_certificate_key /etc/nginx/certs/agent.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Fail closed: never silently downgrade or serve without a valid pair.
    ssl_verify_client off;

    location / {
        proxy_pass http://fwcloud-ai-agent:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation requests can legitimately take minutes; do not time out
        # the proxy hop faster than ASSISTED_PROFILE_AGENT_READ_TIMEOUT_MS on
        # the fwcloud-api side (default 180000ms).
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
    }
}
